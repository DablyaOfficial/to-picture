[package]
name = "topicture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = "3.7.0"
image = "0.25.10"
rfd = "0.18.0"
serde_json = "1.0.154"
slint = "1.19.0"
topicture-bridge = { version = "2.0.0", path = "../bridge" }
topicture-core = { version = "2.0.0", path = "../core" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
slint-build = "1.19.0"
winresource = "0.1.34"
