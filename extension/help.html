<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>To Picture</title>
<style>
:root { --bg:#F3F3F1; --surface:#FFFFFF; --line:#E0E0DC; --text:#1C1C1A; --text2:#5C5C58; --accent:#B4501E; color-scheme:light; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1E1E1D; --surface:#262625; --line:#333331; --text:#ECECEA; --text2:#A6A6A2; --accent:#E8894F; color-scheme:dark; }
}
body { margin:0; background:var(--bg); color:var(--text); font:14px/22px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; }
main { max-width:560px; margin:64px auto; padding:0 16px; }
.head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.head img { width:32px; height:32px; }
h1 { font-size:20px; line-height:28px; margin:0; font-weight:600; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px 20px; }
p { margin:0 0 12px; color:var(--text2); }
ol { margin:0; padding-left:20px; }
li { margin:6px 0; }
a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="head"><img src="icons/48.png" alt=""><h1 data-i18n="helpTitle"></h1></div>
  <div class="card">
    <p data-i18n="helpLead"></p>
    <ol>
      <li><span data-i18n="helpStep1"></span> <a href="https://github.com/DablyaOfficial/to-picture/releases/latest" target="_blank" rel="noopener" data-i18n="helpDownload"></a></li>
      <li data-i18n="helpStep2"></li>
      <li data-i18n="helpStep3"></li>
    </ol>
  </div>
</main>
<script src="help.js"></script>
</body>
</html>
