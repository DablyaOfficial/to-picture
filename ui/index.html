<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>To Picture</title>
<style>
:root {
  --bg:#F3F3F1; --surface:#FFFFFF; --raised:#FBFBFA; --sunken:#E9E9E6; --line:#E0E0DC; --line-strong:#C9C9C4;
  --hover:#EAEAE7; --pressed:#E1E1DD; --text:#1C1C1A; --text2:#5C5C58; --text3:#868681; --track:#E0E0DC; --done:#9A9A95;
  --accent:#B4501E; --accent-hover:#A04419; --accent-pressed:#8C3A15; --on-accent:#FFFFFF; --err:#B3261E; --focus:#1C1C1A;
  --sans:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Mono',Consolas,ui-monospace,monospace;
  color-scheme: light;
}
/* тёмная тема: либо выбрана вручную, либо «как в системе» и Windows в тёмном режиме */
:root[data-theme="dark"] {
  --bg:#1E1E1D; --surface:#262625; --raised:#2C2C2B; --sunken:#181817; --line:#333331; --line-strong:#474745;
  --hover:#343432; --pressed:#2A2A29; --text:#ECECEA; --text2:#A6A6A2; --text3:#7A7A76; --track:#363634; --done:#6A6A66;
  --accent:#E8894F; --accent-hover:#F09A63; --accent-pressed:#D67A42; --on-accent:#161615; --err:#F08A80; --focus:#ECECEA;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1E1E1D; --surface:#262625; --raised:#2C2C2B; --sunken:#181817; --line:#333331; --line-strong:#474745;
    --hover:#343432; --pressed:#2A2A29; --text:#ECECEA; --text2:#A6A6A2; --text3:#7A7A76; --track:#363634; --done:#6A6A66;
    --accent:#E8894F; --accent-hover:#F09A63; --accent-pressed:#D67A42; --on-accent:#161615; --err:#F08A80; --focus:#ECECEA;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px; line-height:20px;
  -webkit-font-smoothing:antialiased; user-select:none; cursor:default;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:default; }
.tab { font-variant-numeric:tabular-nums; }
.mono { font-family:var(--mono); }
.ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.hidden { display:none !important; }
:focus { outline:none; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--line-strong); border:3px solid transparent; background-clip:padding-box; border-radius:5px; }
::-webkit-scrollbar-thumb:hover { background-color:var(--text3); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }

/* ---------- layout ---------- */
.win { height:100vh; display:flex; flex-direction:column; }
.content { flex:1; min-height:0; display:flex; flex-direction:column; gap:16px; padding:14px 20px 0; overflow:hidden; }
.sec { flex:none; }

/* ---------- buttons ---------- */
.btn {
  height:32px; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; border-radius:4px;
  background:var(--raised); border:1px solid var(--line-strong); white-space:nowrap;
}
.btn:hover { background:var(--hover); }
.btn:active { background:var(--pressed); }
.btn:disabled { background:transparent; border-color:var(--line); color:var(--text3); }
.btn.primary { min-width:128px; font-weight:600; background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.primary:active { background:var(--accent-pressed); border-color:var(--accent-pressed); }
.btn.primary:disabled { background:var(--sunken); border-color:var(--line); color:var(--text3); }
.btn.primary.cancel { background:var(--raised); border-color:var(--line-strong); color:var(--text); }
.btn.primary.cancel:hover { background:var(--hover); }
.btn.primary.cancel:active { background:var(--pressed); }
.btn.primary.cancel:disabled { background:var(--sunken); border-color:var(--line); color:var(--text3); }
.tbtn { height:24px; padding:0 8px; display:inline-flex; align-items:center; border-radius:4px; font-size:12px; }
.tbtn:hover { background:var(--hover); }
.tbtn:active { background:var(--pressed); }
.tbtn:disabled { color:var(--text3); background:transparent; }

/* ---------- links ---------- */
.links-head { display:flex; align-items:center; gap:8px; height:24px; margin-bottom:6px; }
.links-head .h { font-weight:600; }
.links-head .sub { font-size:12px; color:var(--text3); }
.links-head .sp { flex:1; }
.links-head .tools { display:flex; gap:2px; }
.input {
  display:flex; height:92px; background:var(--surface); border:1px solid var(--line-strong); border-radius:4px; overflow:hidden;
}
.input:hover { border-color:var(--text3); }
.input.focus { border-color:var(--focus); box-shadow:0 0 0 1px var(--focus); }
.input.ro { background:var(--surface); }
.gutter { width:36px; flex:none; border-right:1px solid var(--line); overflow:hidden; font-size:12px; color:var(--text3); }
.gutter-in { padding:6px 0; }
.gl { height:20px; display:flex; align-items:center; justify-content:flex-end; gap:5px; padding-right:8px; }
.gl .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
.gl .dot.err { background:var(--err); }
.gl svg { color:var(--text2); }
textarea#urls {
  flex:1; min-width:0; border:0; outline:0; resize:none; margin:0; padding:6px 10px; background:transparent; color:var(--text);
  font-family:var(--mono); font-size:12px; line-height:20px; white-space:pre; overflow-x:hidden; overflow-y:auto; user-select:text;
}
textarea#urls::placeholder { color:var(--text3); }
.urllist { flex:1; min-width:0; padding:6px 10px; overflow-y:auto; font-family:var(--mono); font-size:12px; }
.urllist div { height:20px; line-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.urllist .done { color:var(--text2); }

/* ---------- preview ---------- */
.pv { display:flex; gap:16px; height:135px; min-width:0; }
.thumb {
  position:relative; width:240px; height:135px; flex:none; border-radius:4px; overflow:hidden;
  background:var(--sunken); border:1px solid var(--line);
}
.thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .15s; }
.thumb img.on { opacity:1; }
.thumb .center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text3); }
.chip {
  position:absolute; right:6px; bottom:6px; padding:0 5px; height:18px; line-height:18px; border-radius:3px;
  background:rgba(0,0,0,.8); color:#fff; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums;
}
.spin { animation:spin .9s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.pv-meta { flex:1; min-width:0; display:flex; flex-direction:column; }
.pv-title { font-size:15px; line-height:20px; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-wrap:pretty; }
.pv-channel { margin-top:2px; color:var(--text2); }
.pv-line { font-size:12px; line-height:16px; color:var(--text2); margin-bottom:8px; }
/* карточка v2: «Видео / Озвучка / Субтитры» — одна колонка ключ-значение, строки по 22 px */
.pv-grid {
  display:grid; grid-template-columns:72px minmax(0,1fr); grid-auto-rows:22px; align-items:center;
  font-size:12px; line-height:16px; font-variant-numeric:tabular-nums;
}
.pv-grid .k { color:var(--text3); }
.pv-grid .v { display:flex; align-items:center; gap:8px; min-width:0; white-space:nowrap; }
.pv-grid .b, .pv-grid b { font-weight:600; }
.pv-grid .dim { color:var(--text3); }
.pv-grid .note { color:var(--text3); overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pv-grid .val { flex:none; }
.pv-grid .arrow { color:var(--text3); flex:none; }
.pv-grid .shrink { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.mbtn {
  display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 6px; margin-left:-6px; border-radius:4px;
  flex:none; font-size:12px; white-space:nowrap;
}
.mbtn:hover { background:var(--hover); }
.mbtn:active, .mbtn.open { background:var(--pressed); }
.mbtn svg { color:var(--text2); }
.mbtn.plain { margin-left:0; color:var(--text2); }
.mbtn:disabled { color:inherit; background:transparent; }
.mbtn:disabled svg { display:none; }
.reset { margin-left:auto; color:var(--text2); flex:none; }

/* меню дорожек: «По настройке» сверху, группы, «Все дорожки» снизу */
.tmenu { position:fixed; z-index:10; width:300px; padding:4px; background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; display:flex; flex-direction:column; }
.tmenu .mi { height:32px; padding:0 8px; gap:8px; }
.tmenu .mi .ck { width:12px; flex:none; visibility:hidden; color:var(--text); }
.tmenu .mi.sel .ck { visibility:visible; }
.tmenu .mi .hn { margin-left:0; padding-left:0; font-size:12px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tmenu .list { overflow-y:auto; min-height:0; }
.tmenu .gh { height:28px; display:flex; align-items:flex-end; gap:6px; padding:0 8px 4px 28px; font-size:12px; line-height:16px; color:var(--text3); position:sticky; top:0; background:var(--surface); z-index:1; }
.tmenu .foot { font-size:12px; color:var(--text3); padding:6px 8px 4px 28px; line-height:16px; }
/* список субтитров (только чтение) */
.spop { position:fixed; z-index:10; width:380px; padding:10px 12px 12px; background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; display:flex; flex-direction:column; gap:8px; font-size:12px; line-height:16px; }
.spop .sg { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:24px; column-gap:16px; align-items:center; max-height:240px; overflow-y:auto; }
.spop .si { display:flex; align-items:center; gap:6px; min-width:0; white-space:nowrap; }
.spop .si svg { visibility:hidden; flex:none; }
.spop .si.on { font-weight:600; }
.spop .si.on svg { visibility:visible; }
.spop .sf { border-top:1px solid var(--line); padding-top:8px; color:var(--text2); }
/* меню приложения (⋯) */
.dots { width:28px; justify-content:center; gap:3px; padding:0; margin-left:4px; color:var(--text2); }
.dots i { width:3px; height:3px; border-radius:50%; background:currentColor; }
.amenu { position:fixed; z-index:20; width:232px; padding:4px; background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; }
.amenu .gh { height:28px; display:flex; align-items:flex-end; padding:0 8px 4px 28px; font-size:12px; line-height:16px; color:var(--text3); }
.amenu .mi { height:32px; padding:0 8px; gap:8px; }
.amenu .mi .ck { width:12px; flex:none; visibility:hidden; }
.amenu .mi.sel .ck { visibility:visible; }
.amenu .mi .hn { margin-left:auto; font-size:12px; color:var(--text3); }
.hint2 { grid-column:3 / 5; font-size:12px; line-height:16px; color:var(--text3); }
@media (max-width:779px) { .hint2 { grid-column:2 / -1; } }
.sk { height:12px; border-radius:2px; background:var(--sunken); }
.pv-url { font-family:var(--mono); font-size:11px; line-height:16px; color:var(--text3); }
.pv-err { margin-top:2px; color:var(--err); }

/* ---------- collapsible sections ---------- */
.csec { border-top:1px solid var(--line); }
.chead { width:100%; height:36px; display:flex; align-items:center; gap:8px; text-align:left; border-radius:4px; }
.chead .chev { flex:none; color:var(--text2); transition:transform .12s; }
.chead[aria-expanded="true"] .chev { transform:rotate(90deg); }
.chead .t { font-weight:600; flex:none; }
.chead .sum { flex:1; min-width:0; font-size:12px; color:var(--text2); }
.chead:hover .t { color:var(--text); }
.chead:hover .chev { color:var(--text); }

/* ---------- settings ---------- */
.grid {
  display:grid; grid-template-columns:88px minmax(0,1fr) 88px minmax(0,1fr); column-gap:12px; row-gap:8px;
  align-items:center; padding:0 0 12px 20px;
}
.grid .lab { color:var(--text2); }
.grid .wide { grid-column:2 / -1; }
.field {
  height:32px; display:flex; align-items:center; padding:0 10px; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:4px; min-width:0;
}
.folder { display:flex; gap:8px; min-width:0; }
.folder .field { flex:1; }
.select {
  width:100%; height:32px; display:flex; align-items:center; gap:8px; padding:0 8px 0 10px; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:4px; min-width:0; text-align:left;
}
.select:hover { background:var(--hover); }
.select:active { background:var(--pressed); }
.select:focus-visible { outline:none; border-color:var(--focus); box-shadow:0 0 0 1px var(--focus); }
.select:disabled { background:var(--sunken); border-color:var(--line); color:var(--text3); }
.select .v { flex:none; }
.select .hn { flex:1; min-width:0; font-size:12px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.select svg { flex:none; color:var(--text2); margin-left:auto; }
.menu {
  position:fixed; z-index:10; min-width:160px; padding:4px; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:6px; max-height:320px; overflow-y:auto;
}
.mi { height:32px; display:flex; align-items:center; gap:8px; padding:0 10px 0 6px; border-radius:4px; white-space:nowrap; }
.mi .ck { width:14px; flex:none; color:var(--text); visibility:hidden; }
.mi.sel .ck { visibility:visible; }
.mi .hn { font-size:12px; color:var(--text3); margin-left:auto; padding-left:16px; }
.mi.hl { background:var(--hover); }
.msep { height:1px; background:var(--line); margin:4px 2px; }
.crf { display:flex; align-items:center; gap:12px; height:32px; min-width:0; }
.crf .n { font-weight:600; min-width:16px; }
.crf .w { color:var(--text2); white-space:nowrap; }
.crf .note { font-size:12px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
input[type=range] {
  -webkit-appearance:none; appearance:none; width:220px; flex:none; height:20px; margin:0; background:transparent;
}
input[type=range]::-webkit-slider-runnable-track {
  height:2px; border-radius:1px;
  background:linear-gradient(to right, var(--text2) 0 var(--fill,30%), var(--track) var(--fill,30%) 100%);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px; margin-top:-6px; border-radius:50%;
  background:radial-gradient(circle, var(--text) 0 3px, var(--surface) 3.5px); border:1px solid var(--line-strong);
}
input[type=range]:hover::-webkit-slider-thumb { border-color:var(--text3); }
input[type=range]:active::-webkit-slider-thumb { background:radial-gradient(circle, var(--text) 0 4px, var(--surface) 4.5px); }
input[type=range]:focus-visible { outline:none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--focus); }
input[type=range]:disabled::-webkit-slider-thumb { background:radial-gradient(circle, var(--text3) 0 3px, var(--sunken) 3.5px); border-color:var(--line); }
.ro-lock .grid { pointer-events:none; }

/* ---------- progress ---------- */
.prog { display:flex; flex-direction:column; gap:12px; }
.qline { display:flex; align-items:baseline; gap:10px; min-width:0; }
.qline .q { font-weight:600; flex:none; }
.qline .n { font-size:12px; color:var(--text3); }
.row { display:flex; flex-direction:column; gap:6px; min-width:0; }
.row-top { display:flex; align-items:baseline; gap:12px; min-width:0; }
.row-label { display:flex; align-items:center; gap:6px; flex:none; font-weight:600; }
.row-label svg { color:var(--text2); }
.steps { display:flex; align-items:baseline; gap:6px; font-size:12px; min-width:0; overflow:hidden; white-space:nowrap; }
.steps .sep { color:var(--text3); }
.steps .s-done { color:var(--text2); }
.steps .s-cur { color:var(--text); font-weight:600; }
.steps .s-next { color:var(--text3); }
.pct { margin-left:auto; font-size:20px; line-height:24px; font-weight:600; min-width:72px; text-align:right; flex:none; }
.bar { height:4px; border-radius:2px; background:var(--track); overflow:hidden; }
.bar i { display:block; height:100%; width:0; border-radius:2px; background:var(--done); transition:width .35s linear; }
.det { display:flex; gap:12px; font-size:12px; line-height:16px; color:var(--text2); }
.det .l { flex:1; }
.det .r { flex:none; color:var(--text2); }
.row.pending .row-label, .row.pending .pct, .row.pending .det .l { color:var(--text3); }
.row.active .bar i { background:var(--accent); }
.row.done .pct { color:var(--text2); }
.row.error .pct, .row.error .det .l { color:var(--err); }
.row.error .bar i { background:var(--err); }
.result {
  display:flex; flex-direction:column; padding:5px 10px; background:var(--surface);
  border:1px solid var(--line); border-radius:4px; min-width:0;
}
.result .rl { display:flex; align-items:center; gap:10px; height:20px; min-width:0; }
.result .rl2 { font-size:12px; }
.result .t { flex:none; font-weight:600; width:72px; }
.result .t2 { flex:none; width:72px; color:var(--text2); }
.result .p { flex:1; min-width:0; font-size:12px; color:var(--text2); white-space:nowrap; overflow:hidden; }
.result .s { flex:none; font-size:12px; color:var(--text2); }
.errbox { display:flex; gap:10px; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:4px; }
.errbox svg { flex:none; margin-top:2px; color:var(--err); }
.errbox .t { font-weight:600; }
.errbox .m { color:var(--text2); }

/* ---------- log ---------- */
.log { display:flex; flex-direction:column; min-height:0; margin-top:auto; }
.log.open { flex:1 1 0; min-height:96px; margin-top:0; }
.log .sum { font-family:var(--mono); font-size:11px; color:var(--text3); }
.logbox {
  flex:1; min-height:0; overflow:auto; background:var(--sunken); border:1px solid var(--line); border-radius:4px;
  padding:8px 10px; margin-bottom:12px; font-family:var(--mono); font-size:11.5px; line-height:18px; user-select:text; cursor:text;
}
.logbox div { color:var(--text2); white-space:pre-wrap; word-break:break-all; }
.logbox .c { color:var(--text); }
.logbox .e { color:var(--err); }

/* ---------- footer ---------- */
.foot { height:56px; flex:none; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px; padding:0 20px; }
.foot .hint { flex:1; min-width:0; font-size:12px; color:var(--text3); }
.foot .hint.err { color:var(--err); }

/* ---------- reflow ---------- */
@media (max-width:779px) {
  .grid { grid-template-columns:88px minmax(0,1fr); }
}
@media (max-width:759px) {
  .pv { height:108px; }
  .thumb { width:192px; height:108px; }
  .pv-line { margin-bottom:4px; }
}
@media (max-height:700px) {
  .input { height:72px; }
}
</style>
</head>
<body>
<div class="win">
  <div class="content" id="content">

    <!-- ссылки -->
    <section class="sec">
      <div class="links-head">
        <span class="h">Ссылки</span>
        <span class="sub">по одной на строку</span>
        <span class="sp"></span>
        <span class="tools">
          <button class="tbtn" id="bPaste" title="Вставить из буфера обмена">Вставить</button>
          <button class="tbtn" id="bClear">Очистить</button>
          <button class="tbtn dots" id="bApp" title="Меню приложения" aria-haspopup="menu"><i></i><i></i><i></i></button>
        </span>
      </div>
      <div class="input" id="inputBox">
        <div class="gutter"><div class="gutter-in tab" id="gutter"></div></div>
        <textarea id="urls" spellcheck="false" wrap="off" placeholder="https://www.youtube.com/watch?v=…"></textarea>
        <div class="urllist hidden" id="urlList" title="Нажмите, чтобы изменить список"></div>
      </div>
    </section>

    <!-- превью -->
    <section class="sec">
      <div class="pv" id="pv">
        <div class="thumb">
          <img id="pvImg" alt="">
          <div class="center" id="pvThumbMsg">нет ссылки</div>
          <span class="chip hidden" id="pvDur"></span>
        </div>
        <div class="pv-meta" id="pvMeta"></div>
      </div>
    </section>

    <!-- параметры -->
    <section class="sec csec" id="setSec">
      <button class="chead" id="setHead" aria-expanded="false">
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span class="t">Параметры</span>
        <span class="sum ell tab" id="setSum"></span>
      </button>
      <div class="grid hidden" id="setGrid">
        <span class="lab">Папка</span>
        <div class="wide folder">
          <div class="field" id="outDir"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

  subs_lang: [
    { v:'ru_en', l:'Русские и английские' },
    { v:'ru', l:'Только русские' },
    { v:'en', l:'Только английские' },

};
OPTS.encoder = [
  { v:'gpu', l:'Видеокарта', h:'', mh:'быстро, мало памяти' },
  { v:'cpu', l:'Процессор', h:'', mh:'медленно, много памяти' },
];
const DEF_AUDIO = 'orig_ru', DEF_SUBS = 'embed', DEF_SUBS_LANG = 'ru_en';
// видеокарта используется только для H.264/H.265 и только если она нашлась
const useGpu = () => !!S.gpu && S.settings.encoder === 'gpu' && (S.settings.codec === 'h264' || S.settings.codec === 'h265');
const optOf = (k, v) => OPTS[k].find(o => o.v === v) || OPTS[k].find(o => !o.sep);
const LANG_NAMES = (() => { try { return new Intl.DisplayNames(['ru'], { type: 'language' }); } catch { return null; } })();
function langName(code) {
  if (!code || code === 'und') return 'без языка';
  let n = code;
  try { n = LANG_NAMES?.of(code) || code; } catch {}
  return n.charAt(0).toUpperCase() + n.slice(1);
}
const baseLang = (c) => (c || '').split('-')[0].toLowerCase();
const crfWord = (n) => n <= 13 ? 'почти без сжатия' : n <= 17 ? 'визуально без потерь' : n <= 21 ? 'высокое' : n <= 25 ? 'среднее' : 'черновое';

// ---------------------------------------------------------------- formatting
const plural = (n, f) => { const a = n % 10, b = n % 100; return f[a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? 1 : 2]; };
const dec = (x, d) => x.toFixed(d).replace('.', ',');
function sizeUnit(b) { return b >= 1024 ** 3 ? [1024 ** 3, 'ГБ', 2] : b >= 1024 ** 2 ? [1024 ** 2, 'МБ', 1] : [1024, 'КБ', 0]; }
function fmtSize(b) { if (!b && b !== 0) return ''; const [d, u, p] = sizeUnit(b); const v = b / d; return dec(v, v >= 100 ? 0 : p) + ' ' + u; }
function fmtPair(a, b) { const [d, u, p] = sizeUnit(b); const f = (x) => dec(x / d, x / d >= 100 ? 0 : p); return `${f(a)} из ${f(b)} ${u}`; }
function fmtTime(s) {
  if (s == null || !isFinite(s)) return '';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function fmtViews(n) {
  if (n == null) return '';
  if (n >= 1e9) return dec(n / 1e9, 1).replace(',0', '') + ' млрд просмотров';
  if (n >= 1e6) return dec(n / 1e6, 1).replace(',0', '') + ' млн просмотров';
  if (n >= 1e3) return Math.round(n / 1e3) + ' тыс. просмотров';
  return n + ' ' + plural(n, ['просмотр', 'просмотра', 'просмотров']);
}
const MONTHS = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
function fmtDate(d) { return d && d.length === 8 ? `${+d.slice(6)} ${MONTHS[+d.slice(4, 6) - 1]} ${d.slice(0, 4)}` : ''; }
const qTag = (h, fps) => h ? `${h}p${fps && fps > 31 ? Math.round(fps) : ''}` : '';
const groupNum = (n) => Math.round(n).toLocaleString('ru-RU');

// средняя обрезка пути: диск и хвост имени файла остаются видны
const measureCtx = document.createElement('canvas').getContext('2d');
function fitMiddle(el, full) {
  el.title = full;
  const cs = getComputedStyle(el);
  measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const w = el.clientWidth - 2;
  if (w <= 0 || measureCtx.measureText(full).width <= w) { el.textContent = full; return; }
  let lo = 4, hi = full.length, best = full.slice(0, 3) + '…';
  while (lo <= hi) {
    const keep = (lo + hi) >> 1;
    const head = Math.ceil(keep * 0.45), tail = keep - head;
    const s = full.slice(0, head) + '…' + full.slice(full.length - tail);
    if (measureCtx.measureText(s).width <= w) { best = s; lo = keep + 1; } else hi = keep - 1;
  }
  el.textContent = best;
}

// ---------------------------------------------------------------- state
const S = {
  settings: null,
  running: false, cancelling: false,
  listMode: false,            // показываем ссылки как список со статусами (во время и после запуска)
  runUrls: [], lineState: [], // pending | active | done | error
  cur: -1, total: 0,
  dl: null, tc: null, rowsShown: false,
  lastFile: null, lastSize: 0,
  preview: { cache: new Map(), gen: 0, timer: 0, shownUrl: null },
  audioOverride: new Map(),   // url -> язык озвучки, выбранный в превью для конкретного видео
  logLines: 0, logLast: '', versions: '',
  missing: [],
};
let api = null;

// ---------------------------------------------------------------- custom select
const selects = {};
let openMenu = null;
// src: откуда брать варианты и значение. По умолчанию — общая настройка S.settings[key].
function makeSelect(host, key, src) {
  src = src || {
    options: () => OPTS[key],
    get: () => S.settings[key],
    set: (v) => { S.settings[key] = v; onSettingsChanged(); },
  };
  const btn = document.createElement('button');
  btn.className = 'select';
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.innerHTML = `<span class="v"></span><span class="hn"></span>${CHEV_DOWN}`;
  host.appendChild(btn);
  const items = () => src.options().filter(o => !o.sep);
  const sel = {
    btn, key, src,
    render() {
      const o = items().find(x => x.v === src.get()) || items()[0];
      if (!o) return;
      btn.querySelector('.v').textContent = o.l;
      btn.querySelector('.hn').textContent = o.h || '';
      btn.title = o.mh ? `${o.l} — ${o.mh}` : '';
    },
    set(v) { if (src.get() !== v) { src.set(v); this.render(); } },
    step(d) {
      const list = items(), i = list.findIndex(o => o.v === src.get());
      const n = list[Math.max(0, Math.min(list.length - 1, i + d))];
      this.set(n.v);
    },
  };
  btn.addEventListener('click', () => openMenu && openMenu.sel === sel ? closeMenu() : showMenu(sel));
  btn.addEventListener('keydown', (e) => {
    if (openMenu) return;
    if ((e.altKey && e.key === 'ArrowDown') || e.key === 'F4') { e.preventDefault(); showMenu(sel); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel.step(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel.step(-1); }
    else if (e.key.length === 1 && /\S/.test(e.key) && !e.ctrlKey) {
      const list = items(), ch = e.key.toLowerCase();
      const start = list.findIndex(o => o.v === src.get());
      for (let k = 1; k <= list.length; k++) {
        const o = list[(start + k) % list.length];
        if (o.l.toLowerCase().startsWith(ch)) { sel.set(o.v); break; }
      }
    }
  });
  if (!host.dataset.noreg) selects[key] = sel;
  return sel;
}
function showMenu(sel) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu';
  m.setAttribute('role', 'listbox');
  const opts = sel.src.options();
  const curV = sel.src.get();
  let hl = -1, idx = 0;
  const rows = [];
  for (const o of opts) {
    if (o.sep) { m.insertAdjacentHTML('beforeend', '<div class="msep"></div>'); continue; }
    const d = document.createElement('div');
    d.className = 'mi' + (o.v === curV ? ' sel' : '');
    d.innerHTML = `${MENU_CK}<span>${esc(o.l)}</span>${o.mh || o.h ? `<span class="hn">${esc(o.mh || o.h)}</span>` : ''}`;
    const my = idx++;
    if (o.v === curV) hl = my;
    d.addEventListener('mousemove', () => setHl(my));
    d.addEventListener('click', () => { sel.set(o.v); closeMenu(); sel.btn.focus(); });
    rows.push({ d, o });
    m.appendChild(d);
  }
  function setHl(i) { hl = i; rows.forEach((r, k) => r.d.classList.toggle('hl', k === i)); rows[i]?.d.scrollIntoView({ block: 'nearest' }); }
  document.body.appendChild(m);
  const r = sel.btn.getBoundingClientRect();
  m.style.minWidth = r.width + 'px';
  m.style.maxHeight = Math.min(320, innerHeight - 16) + 'px';
  const mh = m.offsetHeight, below = innerHeight - r.bottom - 8;
  m.style.left = Math.min(r.left, innerWidth - m.offsetWidth - 8) + 'px';
  m.style.top = (mh <= below || r.top < mh ? r.bottom + 4 : r.top - mh - 4) + 'px';
  setHl(Math.max(0, hl));
  const onKey = (e) => {
    if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeMenu(); sel.btn.focus(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setHl(Math.min(rows.length - 1, hl + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHl(Math.max(0, hl - 1)); }
    else if (e.key === 'Home') { e.preventDefault(); setHl(0); }
    else if (e.key === 'End') { e.preventDefault(); setHl(rows.length - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel.set(rows[hl].o.v); closeMenu(); sel.btn.focus(); }
    else if (e.key.length === 1) {
      const ch = e.key.toLowerCase();
      for (let k = 1; k <= rows.length; k++) { const j = (hl + k) % rows.length; if (rows[j].o.l.toLowerCase().startsWith(ch)) { setHl(j); break; } }
    }
    e.stopPropagation();
  };
  const onDown = (e) => { if (!m.contains(e.target) && !sel.btn.contains(e.target)) closeMenu(); };
  document.addEventListener('keydown', onKey, true);
  document.addEventListener('mousedown', onDown, true);
  window.addEventListener('blur', closeMenu);
  openMenu = { m, sel, onKey, onDown };
}
function closeMenu() {
  if (!openMenu) return;
  document.removeEventListener('keydown', openMenu.onKey, true);
  document.removeEventListener('mousedown', openMenu.onDown, true);
  window.removeEventListener('blur', closeMenu);
  openMenu.anchor?.classList.remove('open');
  openMenu.m.remove();
  openMenu = null;
}

// ---------------------------------------------------------------- settings
function settingsSummary() {
  const s = S.settings, c = optOf('codec', s.codec), res = optOf('max_height', s.max_height).l.toLowerCase();
  const parts = [];
  if (s.codec === 'h264' || s.codec === 'h265') parts.push(c.l + (useGpu() ? ' · ' + S.gpu.short : ''), `CRF ${s.crf}`, s.preset, optOf('audio', s.audio).l);
  else if (s.codec === 'prores') parts.push('ProRes 422', 'PCM');
  else parts.push('Без перекодирования');
  parts.push(res);
  // озвучка и субтитры — только если отличаются от умолчаний, перед папкой (папка обрезается первой)
  if (s.audio_lang !== DEF_AUDIO) parts.push('озвучка: ' + optOf('audio_lang', s.audio_lang).l.toLowerCase());
  if (s.subs === 'off') parts.push('без субтитров');
  else if (s.subs !== DEF_SUBS || s.subs_lang !== DEF_SUBS_LANG)
    parts.push('субтитры: ' + optOf('subs_lang', s.subs_lang).l.toLowerCase() + (s.subs === 'embed_srt' ? ' + .srt' : ''));
  parts.push(s.out_dir);
  return parts.join(' · ');
}
function codecDesc() {
  const s = S.settings;
  if (s.codec === 'h264' || s.codec === 'h265') return `${optOf('codec', s.codec).l}${useGpu() ? ' на видеокарте' : ''}, CRF ${s.crf}, ${s.preset}`;
  if (s.codec === 'prores') return 'ProRes 422, PCM';
  return 'без перекодирования';
}
function renderSettings() {
  const s = S.settings;
  Object.values(selects).forEach(x => x.render());
  const crf = $('crf');
  crf.value = s.crf;
  crf.style.setProperty('--fill', ((s.crf - 10) / 20 * 100) + '%');
  $('crfN').textContent = s.crf;
  $('crfW').textContent = crfWord(s.crf);
  const x264 = s.codec === 'h264' || s.codec === 'h265';
  document.querySelectorAll('.x264').forEach(e => e.classList.toggle('hidden', !x264));
  document.querySelectorAll('.gpu-on').forEach(e => e.classList.toggle('hidden', !x264 || !S.gpu));
  $('encHint').textContent = s.encoder === 'gpu'
    ? `${S.gpu ? S.gpu.vendor + ' ' + S.gpu.short : ''} — в разы быстрее, почти не занимает память`
    : 'процессор: медленнее, при 4K может занять 2–4 ГБ памяти';
  document.querySelectorAll('.subs-on').forEach(e => e.classList.toggle('hidden', s.subs === 'off'));
  document.querySelectorAll('.subs-off').forEach(e => e.classList.toggle('hidden', s.subs !== 'off'));
  fitMiddle($('outDir'), s.out_dir);
  const sum = settingsSummary();
  $('setSum').textContent = sum;
  $('setSum').title = sum;
  const open = !!s.settings_open;
  $('setHead').setAttribute('aria-expanded', open);
  $('setGrid').classList.toggle('hidden', !open);
  $('setSum').classList.toggle('hidden', open);
  if (S.preview.shownData) renderPreview(S.preview.shownData);   // «На выходе» зависит от кодека
  applyTheme();
}
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.settings.theme || 'system';
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'system' && darkMQ.matches);
  if (dark !== S.darkApplied) { S.darkApplied = dark; api && api.set_dark(dark); }
}
let saveTimer = 0;
function onSettingsChanged() {
  renderSettings();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => api && api.save_settings(S.settings), 300);
}
function setSettingsOpen(v) {
  S.settings.settings_open = v;
  onSettingsChanged();
}
function lockSettings(lock) {
  $('setSec').classList.toggle('ro-lock', lock);
  Object.values(selects).forEach(x => x.btn.disabled = lock);
  document.querySelectorAll('#pvAudio .mbtn, #pvAudio .reset').forEach(b => b.disabled = lock);
  $('crf').disabled = lock;
  $('bBrowse').disabled = lock;
}

// ---------------------------------------------------------------- link list
const ta = $('urls');
function textLines() { return ta.value.split('\n'); }
function validUrls() { return textLines().map(s => s.trim()).filter(s => URL_RE.test(s)); }
function renderGutter() {
  let html = '';
  if (S.listMode) {
    S.runUrls.forEach((u, i) => {
      const st = S.lineState[i];
      const mark = st === 'active' ? '<span class="dot"></span>' : st === 'done' ? CHECK : st === 'error' ? '<span class="dot err"></span>' : '';
      html += `<div class="gl">${mark}<span>${i + 1}</span></div>`;
    });
  } else {
    const n = Math.max(1, textLines().length);
    for (let i = 1; i <= n; i++) html += `<div class="gl"><span>${i}</span></div>`;
  }
  $('gutter').innerHTML = html;
  syncGutter();
}
function syncGutter() {
  const src = S.listMode ? $('urlList') : ta;
  $('gutter').style.transform = `translateY(${-src.scrollTop}px)`;
}
function renderUrlList() {
  $('urlList').innerHTML = S.runUrls.map((u, i) =>
    `<div class="${S.lineState[i] === 'done' ? 'done' : ''}" title="${esc(u)}">${esc(u)}</div>`).join('');
}
function setListMode(on) {
  S.listMode = on;
  ta.classList.toggle('hidden', on);
  $('urlList').classList.toggle('hidden', !on);
  if (on) renderUrlList();
  renderGutter();
  updateButtons();
}
function editList() {
  if (S.running || !S.listMode) return;
  setListMode(false);
  ta.focus();
}
function appendText(text) {
  text = (text || '').trim();
  if (!text) return;
  if (S.listMode) setListMode(false);
  const cur = ta.value.replace(/\s+$/, '');
  ta.value = (cur ? cur + '\n' : '') + text + '\n';
  ta.selectionStart = ta.selectionEnd = ta.value.length;
  onListChanged();
  ta.scrollTop = ta.scrollHeight;
}
function onListChanged() {
  // выбор озвучки живёт вместе со строкой ссылки: убрали или изменили строку — выбор сбрасывается
  const live = new Set(validUrls());
  for (const u of [...S.audioOverride.keys()]) if (!live.has(u)) S.audioOverride.delete(u);
  renderGutter();
  updateButtons();
  schedulePreview();
}

// ---------------------------------------------------------------- preview
function lastValidUrl() { const v = validUrls(); return v.length ? v[v.length - 1] : null; }
function schedulePreview() {
  clearTimeout(S.preview.timer);
  S.preview.timer = setTimeout(() => { if (!S.running) showPreviewFor(lastValidUrl(), true); }, 400);
}
function getPreview(url) {
  const c = S.preview.cache;
  if (!c.has(url)) c.set(url, api.preview(url).catch(e => ({ ok: false, error: 'Не удалось получить данные.' })));
  return c.get(url);
}
async function showPreviewFor(url, fromEdit) {
  if (url === S.preview.shownUrl && S.preview.shownData) return;
  S.preview.shownUrl = url;
  const gen = ++S.preview.gen;
  if (!url) {
    const hasText = ta.value.trim() && fromEdit;
    S.preview.shownData = null;
    return hasText ? renderPreviewState('error', { err: 'Строка не похожа на ссылку.', title: 'Ссылка не распознана', url: textLines().filter(s => s.trim()).pop() }) : renderPreviewState('empty');
  }
  renderPreviewState('loading', { url });
  const data = await getPreview(url);
  if (gen !== S.preview.gen) return;
  if (!data || !data.ok) {
    S.preview.cache.delete(url);   // ошибку не кешируем — можно попробовать ещё раз
    S.preview.shownData = null;
    return renderPreviewState('error', { err: data?.error || 'Не удалось получить данные.', url });
  }
  data.url = url;
  S.preview.shownData = data;
  renderPreview(data);
}
function renderPreviewState(state, o = {}) {
  const img = $('pvImg'), msg = $('pvThumbMsg'), dur = $('pvDur'), meta = $('pvMeta');
  img.classList.remove('on'); img.removeAttribute('src');
  dur.classList.add('hidden');
  if (state === 'empty') {
    msg.innerHTML = 'нет ссылки';
    meta.innerHTML = '<div style="color:var(--text3)">Превью последней ссылки в списке</div>';
  } else if (state === 'loading') {
    msg.innerHTML = '<svg class="spin" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--line-strong)" stroke-width="2"/><path d="M10 2a8 8 0 0 1 8 8" fill="none" stroke="var(--text2)" stroke-width="2" stroke-linecap="round"/></svg>';
    meta.innerHTML = `<div class="sk" style="width:78%;margin-top:4px"></div><div class="sk" style="width:52%;margin-top:8px"></div>
      <div class="sk" style="width:30%;height:10px;margin-top:12px"></div><div style="flex:1"></div>
      <div style="font-size:12px;line-height:16px;color:var(--text2)">Получение данных…</div>
      <div class="pv-url ell">${esc(o.url)}</div>`;
  } else if (state === 'error') {
    msg.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 5.5v5.5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="14" r="1" fill="currentColor"/></svg>';
    meta.innerHTML = `<div class="pv-title">${esc(o.title || 'Видео недоступно')}</div><div class="pv-err">${esc(o.err)}</div>
      <div style="flex:1"></div><div class="pv-url ell" title="${esc(o.url)}">${esc(o.url)}</div>`;
  }
}
// какой видеопоток возьмёт программа (повторяет select_video из ToPicture.pyw)
function selectVideo(d) {
  const v = d.vfmts || [];
  if (!v.length) return { f: d.height ? { h: d.height, fps: Math.round(d.fps || 0), vc: d.vcodec, hdr: false } : null, copy: false };
  const s = S.settings, lim = s.max_height === 'best' ? 0 : +s.max_height;
  const pool = v.filter(f => !lim || f.h <= lim).length ? v.filter(f => !lim || f.h <= lim) : v;
  const better = (a, b) => (a.h - b.h) || (a.fps - b.fps) || (a.https - b.https) || (a.tbr - b.tbr);
  const best = (list) => list.reduce((a, b) => better(a, b) >= 0 ? a : b);
  if (s.codec === 'copy') return { f: best(pool), copy: false };
  const sdr = pool.filter(f => !f.hdr).length ? pool.filter(f => !f.hdr) : pool;
  const b = best(sdr);
  if (s.codec === 'h264') {
    const avc = sdr.filter(f => f.vc.startsWith('avc1') && f.h === b.h && f.fps === b.fps);
    if (avc.length) return { f: best(avc), copy: true };
  }
  return { f: b, copy: false };
}
function outputLabel(d) {
  const s = S.settings;
  const { f, copy } = selectVideo(d);
  const q = f ? qTag(f.h, f.fps) : '';
  // YouTube уже отдаёт H.264 нужного разрешения — видео только перепаковывается
  const c = copy ? 'без перекодирования' : s.codec === 'copy' ? (f?.vc || 'исходный') : optOf('codec', s.codec).name;
  // со встроенными субтитрами файл всегда MKV (см. process() в ToPicture.pyw)
  const box = subsChosen(d).length || s.codec === 'copy' ? 'MKV' : s.codec === 'prores' ? 'MOV' : 'MP4';
  return [copy ? '' : q, c, box].filter(Boolean).join(' · ');
}
function renderPreview(d) {
  const img = $('pvImg'), msg = $('pvThumbMsg'), dur = $('pvDur');
  msg.innerHTML = '';
  if (d.thumb) {
    if (img.getAttribute('src') !== d.thumb) {
      img.classList.remove('on');
      img.onload = () => img.classList.add('on');
      img.onerror = () => { img.classList.remove('on'); msg.textContent = 'нет миниатюры'; };
      img.src = d.thumb;
    } else img.classList.add('on');
  } else msg.textContent = 'нет миниатюры';
  if (d.duration) { dur.textContent = fmtTime(d.duration); dur.classList.remove('hidden'); } else dur.classList.add('hidden');
  const byline = [d.channel, fmtViews(d.views), fmtDate(d.date)].filter(Boolean).join(' · ');
  const sv = selectVideo(d).f;
  const src = sv ? [qTag(sv.h, sv.fps), sv.vc + (sv.hdr ? ' HDR' : '')].filter(Boolean).join(' · ') : '';
  $('pvMeta').innerHTML = `
    <div class="pv-title" title="${esc(d.title)}">${esc(d.title)}</div>
    <div class="pv-channel ell tab" title="${esc(byline)}">${esc(byline)}</div>
    <div style="flex:1"></div>
    <div class="pv-grid">
      <span class="k">Видео</span>
      <div class="v"><span class="b val">${esc(src || '—')}</span><span class="arrow">→</span><span class="shrink">${esc(outputLabel(d))}</span></div>
      <span class="k" id="pvAudioK">Озвучка</span><div class="v" id="pvAudio"></div>
      <span class="k">Субтитры</span><div class="v" id="pvSubs"></div>
    </div>`;
  renderAudioCell(d);
  renderSubsCell(d);
}

// ---- выбор дорожек (повторяет pick_audio / pick_subs из ToPicture.pyw)
function pickAudio(tracks, rule) {
  if (!tracks || tracks.length <= 1) return tracks ? tracks.slice() : [];
  if (rule === 'all') return tracks.slice();
  const orig = tracks.find(t => t.original) || tracks[0];
  if (Array.isArray(rule)) {
    const want = rule.map(baseLang);
    const out = tracks.filter(t => want.includes(baseLang(t.lang)));
    out.sort((a, b) => (a.original === b.original ? want.indexOf(baseLang(a.lang)) - want.indexOf(baseLang(b.lang)) : a.original ? -1 : 1));
    return out.length ? out : [orig];
  }
  const extra = { orig: [], orig_ru: ['ru'], orig_ru_en: ['ru', 'en'] }[rule] || ['ru'];
  const out = [orig];
  for (const l of extra) {
    const t = tracks.find(t => baseLang(t.lang) === l);
    if (t && !out.includes(t)) out.push(t);
  }
  return out;
}
function pickSubs(avail, rule, audioLangs, origLang) {
  const one = (l) => avail.filter(k => baseLang(k) === l).sort((a, b) => (a !== l) - (b !== l) || a.localeCompare(b)).slice(0, 1);
  if (rule === 'all') return avail.slice();
  const langs = rule === 'audio'
    ? (audioLangs.length ? audioLangs.map(baseLang) : [baseLang(origLang)])
    : ({ ru_en: ['ru', 'en'], ru: ['ru'], en: ['en'] }[rule] || ['ru', 'en']);
  const out = [];
  for (const l of [...new Set(langs)]) if (l) out.push(...one(l));
  return out;
}
const tName = (code) => langName(baseLang(code));
function namesShort(codes, max = 2) {
  const n = codes.map(tName);
  return n.length <= max ? n.join(', ') : `${n.slice(0, max).join(', ')} +${n.length - max}`;
}
function currentAudio(d) {
  const tracks = d.tracks || [];
  const ov = S.audioOverride.get(d.url);
  return { tracks, ov, rule: pickAudio(tracks, S.settings.audio_lang), cur: pickAudio(tracks, ov || S.settings.audio_lang) };
}

function renderAudioCell(d) {
  const cell = $('pvAudio');
  const { tracks, ov, rule, cur } = currentAudio(d);
  if (tracks.length <= 1) {
    const known = tracks.length && tracks[0].lang !== 'und';
    // одна дорожка — просто язык; язык неизвестен — строку не показываем
    $('pvAudioK').classList.toggle('hidden', !known);
    cell.classList.toggle('hidden', !known);
    cell.innerHTML = known ? `<span class="shrink">${esc(tName(tracks[0].lang))}</span>` : '';
    return;
  }
  const n = tracks.length;
  const label = cur.length === n ? `Все (${n})` : namesShort(cur.map(t => t.lang));
  const note = ov
    ? `для этой ссылки · по настройке: ${namesShort(rule.map(t => t.lang), 3).toLowerCase()}`
    : `по настройке · у видео ${n} ${plural(n, ['дорожка', 'дорожки', 'дорожек'])}`;
  cell.innerHTML = `
    <button class="mbtn" id="pvAudioBtn" aria-haspopup="listbox" ${ov ? 'style="font-weight:600"' : ''}>${esc(label)}${CHEV_SM}</button>
    <span class="note" title="${esc(note)}">${esc(note)}</span>
    ${ov ? '<button class="tbtn reset" id="pvAudioReset">сбросить</button>' : ''}`;
  const btn = $('pvAudioBtn');
  btn.disabled = S.running;
  btn.title = 'В файл встроятся: ' + cur.map(t => tName(t.lang) + (t.original ? ' (оригинал)' : '')).join(', ');
  btn.addEventListener('click', () => (openMenu && openMenu.anchor === btn) ? closeMenu() : showTrackMenu(btn, d));
  btn.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown' || (e.altKey && e.key === 'ArrowDown')) { e.preventDefault(); showTrackMenu(btn, d); } });
  $('pvAudioReset')?.addEventListener('click', () => { S.audioOverride.delete(d.url); renderPreview(d); $('pvAudioBtn')?.focus(); });
}

function renderSubsCell(d) {
  const cell = $('pvSubs');
  const avail = d.subs || [];
  if (!avail.length) {
    cell.innerHTML = d.auto_subs
      ? '<span class="note">только автоматические · не скачиваются</span>'
      : '<span class="dim">нет</span>';
    return;
  }
  const n = avail.length;
  const cnt = `${n} ${plural(n, ['язык', 'языка', 'языков'])}`;
  const chosen = subsChosen(d);
  let html;
  if (S.settings.subs === 'off') {
    html = `<button class="mbtn" id="pvSubsBtn">${cnt}${CHEV_SM}</button><span class="note">не скачиваются</span>`;
  } else if (chosen.length) {
    const where = S.settings.subs === 'embed_srt' ? 'в видео и .srt' : 'в видео';
    html = `<b class="shrink" title="${esc(chosen.map(tName).join(', '))}">${esc(namesShort(chosen, 3))}</b>
      <span style="color:var(--text2);flex:none">${where}</span>
      <button class="mbtn plain" id="pvSubsBtn">${cnt}${CHEV_SM}</button>`;
  } else {
    html = `<span class="val">нужного языка нет</span>
      <button class="mbtn plain" id="pvSubsBtn">есть ${cnt}${CHEV_SM}</button>`;
  }
  cell.innerHTML = html;
  const btn = $('pvSubsBtn');
  btn.addEventListener('click', () => (openMenu && openMenu.anchor === btn) ? closeMenu() : showSubsPop(btn, d));
}
function subsChosen(d) {
  if (S.settings.subs === 'off') return [];
  const { cur } = currentAudio(d);
  return pickSubs(d.subs || [], S.settings.subs_lang, cur.map(t => t.lang), d.language);
}

// ---- всплывающие окна у карточки: общие хелперы (закрытие — через closeMenu)
function placePopup(m, anchor, width) {
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left - 6, innerWidth - width - 8)) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
}
function registerPopup(m, anchor, onKey) {
  anchor.classList.add('open');
  const onDown = (e) => { if (!m.contains(e.target) && !anchor.contains(e.target)) closeMenu(); };
  const key = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(); anchor.focus(); return; }
    if (onKey) onKey(e);
  };
  document.addEventListener('keydown', key, true);
  document.addEventListener('mousedown', onDown, true);
  window.addEventListener('blur', closeMenu);
  openMenu = { m, anchor, sel: { btn: anchor }, onKey: key, onDown };
}

function showTrackMenu(anchor, d) {
  closeMenu();
  const { tracks, ov, rule } = currentAudio(d);
  const n = tracks.length;
  const m = document.createElement('div');
  m.className = 'tmenu';
  m.setAttribute('role', 'listbox');
  m.setAttribute('aria-multiselectable', 'true');
  const groups = [
    ['Оригинал', tracks.filter(t => t.original)],
    ['Дубляж', tracks.filter(t => !t.original && !t.auto)],
    ['Автоперевод YouTube', tracks.filter(t => !t.original && t.auto)],
  ].filter(g => g[1].length);
  groups.forEach(g => g[1].sort((a, b) => tName(a.lang).localeCompare(tName(b.lang), 'ru')));
  m.innerHTML = `
    <div class="mi" data-act="rule">${MENU_CK}<span>По настройке</span><span class="hn">${esc(namesShort(rule.map(t => t.lang), 3))}</span></div>
    <div class="msep"></div>
    <div class="list">${groups.map(([g, list]) => `
      <div class="gh"><span>${g}</span><span class="tab">${list.length > 1 ? list.length : ''}</span></div>
      ${list.map(t => `<div class="mi" data-lang="${esc(t.lang)}" role="option">${MENU_CK}<span>${esc(tName(t.lang))}</span></div>`).join('')}`).join('')}
    </div>
    <div class="msep"></div>
    <div class="mi" data-act="all">${MENU_CK}<span class="tab">Все дорожки (${n})</span><span class="hn">файл заметно больше</span></div>
    <div class="foot">Отмеченные встроятся в файл отдельными дорожками</div>`;
  placePopup(m, anchor, 300);
  const top = anchor.getBoundingClientRect().bottom + 4;
  const listMax = Math.max(120, Math.min(296, innerHeight - top - 8 - (32 * 2 + 9 * 2 + 30 + 8)));
  m.querySelector('.list').style.maxHeight = listMax + 'px';

  const items = [...m.querySelectorAll('.mi')];
  let hl = -1;
  const setHl = (i) => { hl = i; items.forEach((x, k) => x.classList.toggle('hl', k === i)); items[i]?.scrollIntoView({ block: 'nearest' }); };
  const sync = () => {
    const st = currentAudio(d);
    const langs = st.cur.map(t => t.lang);
    items.forEach(x => {
      if (x.dataset.act === 'rule') x.classList.toggle('sel', !st.ov);
      else if (x.dataset.act === 'all') x.classList.toggle('sel', st.cur.length === n);
      else x.classList.toggle('sel', langs.includes(x.dataset.lang));
    });
  };
  const apply = (x) => {
    const st = currentAudio(d);
    if (x.dataset.act === 'rule') { S.audioOverride.delete(d.url); }
    else if (x.dataset.act === 'all') { S.audioOverride.set(d.url, 'all'); }
    else {
      const langs = st.cur.map(t => t.lang);
      const i = langs.indexOf(x.dataset.lang);
      if (i >= 0) { if (langs.length === 1) return; langs.splice(i, 1); } else langs.push(x.dataset.lang);
      const ruleLangs = st.rule.map(t => t.lang);
      const same = langs.length === ruleLangs.length && langs.every(l => ruleLangs.includes(l));
      same ? S.audioOverride.delete(d.url) : S.audioOverride.set(d.url, langs.length === n ? 'all' : langs);
    }
    renderPreview(d);
    const nb = $('pvAudioBtn');
    if (openMenu) { openMenu.anchor = nb; openMenu.sel.btn = nb; nb?.classList.add('open'); }
    sync();
    if (x.dataset.act) { closeMenu(); nb?.focus(); }
  };
  items.forEach((x, i) => {
    x.addEventListener('mousemove', () => setHl(i));
    x.addEventListener('click', () => apply(x));
  });
  sync();
  setHl(Math.max(0, items.findIndex(x => x.classList.contains('sel') && x.dataset.lang)));
  registerPopup(m, anchor, (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setHl(Math.min(items.length - 1, hl + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHl(Math.max(0, hl - 1)); }
    else if (e.key === 'Home') { e.preventDefault(); setHl(0); }
    else if (e.key === 'End') { e.preventDefault(); setHl(items.length - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (items[hl]) apply(items[hl]); }
    else if (e.key === 'Tab') { closeMenu(); }
    else if (e.key.length === 1 && /\S/.test(e.key)) {
      const ch = e.key.toLowerCase();
      for (let k = 1; k <= items.length; k++) { const j = (hl + k) % items.length; if (items[j].textContent.trim().toLowerCase().startsWith(ch)) { setHl(j); break; } }
    }
    e.stopPropagation();
  });
}

function showSubsPop(anchor, d) {
  closeMenu();
  const avail = d.subs || [];
  const chosen = subsChosen(d);
  const rule = optOf('subs_lang', S.settings.subs_lang).l;
  const foot = S.settings.subs === 'off'
    ? 'Субтитры выключены в параметрах.'
    : chosen.length
      ? `Встроятся: ${chosen.map(tName).join(', ').toLowerCase()}${S.settings.subs === 'embed_srt' ? ', и рядом файлом .srt' : ''}. Правило — в параметрах: «${rule}».`
      : `Нужного языка нет. Правило — в параметрах: «${rule}».`;
  const m = document.createElement('div');
  m.className = 'spop';
  const sorted = avail.slice().sort((a, b) => tName(a).localeCompare(tName(b), 'ru'));
  m.innerHTML = `
    <span style="color:var(--text3)">Официальные субтитры · ${avail.length}</span>
    <div class="sg">${sorted.map(k => `<div class="si${chosen.includes(k) ? ' on' : ''}" title="${esc(k)}">${MENU_CK}<span class="shrink">${esc(tName(k))}</span></div>`).join('')}</div>
    <div class="sf">${esc(foot)}</div>`;
  placePopup(m, anchor, 380);
  registerPopup(m, anchor);
}

// ---- меню приложения (⋯): настройки самой программы, отдельно от параметров файла
function showAppMenu(anchor) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'amenu';
  m.setAttribute('role', 'menu');
  const v = S.appInfo ? S.appInfo.version + (S.appInfo.portable ? ' portable' : '') : '';
  m.innerHTML = `
    <div class="gh">Тема</div>
    ${OPTS.theme.map(o => `<div class="mi${S.settings.theme === o.v ? ' sel' : ''}" data-theme="${o.v}" role="menuitemradio">${MENU_CK}<span>${o.l}</span></div>`).join('')}
    <div class="msep"></div>
    <div class="mi" data-act="data" role="menuitem"><span class="ck"></span><span>Папка настроек</span></div>
    <div class="mi" data-act="about" role="menuitem"><span class="ck"></span><span>О программе</span><span class="hn tab">${esc(v)}</span></div>`;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, r.right - 232) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
  const items = [...m.querySelectorAll('.mi')];
  let hl = items.findIndex(x => x.classList.contains('sel'));
  const setHl = (i) => { hl = i; items.forEach((x, k) => x.classList.toggle('hl', k === i)); };
  const act = (x) => {
    if (x.dataset.theme) { S.settings.theme = x.dataset.theme; onSettingsChanged(); }
    else if (x.dataset.act === 'data') api.open_data_dir();
    else if (x.dataset.act === 'about') { setLogOpen(true); appendLog(`To Picture ${v} · ${S.versions || ''}`, 'c'); }
    closeMenu(); anchor.focus();
  };
  items.forEach((x, i) => { x.addEventListener('mousemove', () => setHl(i)); x.addEventListener('click', () => act(x)); });
  setHl(Math.max(0, hl));
  registerPopup(m, anchor, (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setHl(Math.min(items.length - 1, hl + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHl(Math.max(0, hl - 1)); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(items[hl]); }
    else if (e.key === 'Tab') closeMenu();
    e.stopPropagation();
  });
}

// ---------------------------------------------------------------- progress rows
// шаги загрузки идут в том порядке, в каком их делает yt-dlp: сначала субтитры, потом видео и звук
function dlSteps(r) {
  const list = [];
  if (S.settingsAtRun && S.settingsAtRun.subs !== 'off') list.push(['subs', 'субтитры']);
  list.push(['video', 'видео']);
  const an = r.audio_n || 1;
  list.push(['audio', an > 1 ? (r.step === 'audio' ? `аудио ${r.audio_i || 1} из ${an}` : `аудио ×${an}`) : 'аудио']);
  list.push(['merge', 'объединение']);
  return list;
}
function rowHtml(r) {
  const pct = r.state === 'done' ? 100 : (r.pct || 0);
  const pctText = r.state === 'pending' || r.state === 'error' ? '—' : Math.floor(pct) + NB + '%';
  let steps = '';
  if (r.step != null && r.state !== 'pending') {
    const list = dlSteps(r);
    const ci = r.state === 'done' ? list.length : list.findIndex(x => x[0] === r.step);
    steps = list.map(([, t], i) => {
      const cls = i < ci ? 's-done' : i === ci ? 's-cur' : 's-next';
      return (i ? '<span class="sep">›</span>' : '') + `<span class="${cls} tab">${t}</span>`;
    }).join('');
  }
  return `<div class="row ${r.state}">
    <div class="row-top">
      <span class="row-label"><span>${r.label}</span>${r.state === 'done' ? CHECK_ROW : ''}</span>
      <div class="steps">${steps}</div>
      <span class="pct tab">${pctText}</span>
    </div>
    <div class="bar"><i style="width:${r.state === 'pending' ? 0 : pct}%"></i></div>
    <div class="det tab"><span class="l ell" title="${esc(r.l)}">${esc(r.l || '')}</span><span class="r">${esc(r.r || '')}</span></div>
  </div>`;
}
function renderRows() {
  const rows = [S.dl];
  if (S.settingsAtRun.codec !== 'copy') rows.push(S.tc);
  $('rows').innerHTML = rows.map(rowHtml).join('<div style="height:12px"></div>');
  $('rows').classList.toggle('hidden', !S.rowsShown);
}
function setTitle(t) { api && api.set_title(t ? `${t} — To Picture` : 'To Picture'); }
function updateTitle() {
  if (!S.running) return setTitle('');
  const act = S.tc.state === 'active' ? S.tc : S.dl.state === 'active' ? S.dl : null;
  if (!act) return setTitle('');
  setTitle(`${Math.floor(act.pct || 0)}${NB}% · ${act === S.dl ? 'Скачивание' : act.label}`);
}
function nextLabel() {
  const i = S.cur + 1;
  if (i >= S.total) return '';
  const u = S.runUrls[i];
  const c = S.preview.resolved?.get(u);
  return 'далее: ' + (c && c.ok ? c.title : u);
}

// ---------------------------------------------------------------- run
function start() {
  if (S.running) return;
  const urls = S.listMode ? S.runUrls.slice() : validUrls();
  if (!urls.length || S.missing.length) return;
  closeMenu();
  S.running = true; S.cancelling = false;
  S.runUrls = urls; S.lineState = urls.map(() => 'pending');
  S.cur = -1; S.total = urls.length; S.settingsAtRun = { ...S.settings };
  S.lastFile = null; S.runStart = Date.now();
  S.preview.resolved = new Map();
  urls.forEach(u => getPreview(u).then(d => S.preview.resolved.set(u, d)));
  setListMode(true);
  lockSettings(true);
  $('prog').classList.remove('hidden');
  $('result').classList.add('hidden');
  $('errBox').classList.add('hidden');
  S.rowsShown = false;
  updateButtons();
  const overrides = {};
  for (const u of urls) if (S.audioOverride.get(u)) overrides[u] = { audio: S.audioOverride.get(u) };
  api.start(urls, S.settings, overrides).then(ok => { if (!ok) { S.running = false; updateButtons(); } });
}
function cancel() {
  if (!S.running || S.cancelling) return;
  S.cancelling = true;
  updateButtons();
  api.cancel();
}

const app = window.app = {
  onEvent(ev) {
    const h = handlers[ev.kind];
    if (h) h(ev);
  },
};
const handlers = {
  log(ev) { appendLog(ev.line, ev.level); },
  ytdlp(ev) { appendLog(ev.line, ev.level); },
  item(ev) {
    S.cur = ev.index;
    S.lineState[ev.index] = 'active';
    renderGutter(); renderUrlList();
    S.dl = { label: 'Скачивание', state: 'active', pct: 0, step: 'video', l: 'подключение…', r: '' };
    S.tc = { label: 'Транскодирование', state: 'pending', l: 'ожидает · ' + codecDesc(), r: '' };
    // если по превью уже понятно, что YouTube отдаёт H.264, — честно пишем «перепаковка»
    const pd = S.preview.resolved?.get(S.runUrls[ev.index]);
    if (pd && pd.ok && selectVideo(pd).copy) S.tc = { label: 'Перепаковка', copy: true, state: 'pending', l: 'ожидает · без перекодирования', r: '' };
    S.rowsShown = false; S.gotProgress = false;
    renderRows();
    $('qLabel').textContent = `Видео ${ev.index + 1} из ${ev.total}`;
    $('qNext').textContent = nextLabel();
    $('qNext').title = $('qNext').textContent;
    showPreviewFor(S.runUrls[ev.index]);
    updateTitle();
  },
  progress(ev) {
    S.rowsShown = true;
    if (ev.stage === 'download') {
      const r = S.dl;
      r.state = 'active';
      r.step = ev.step;
      if (ev.audio_n) { r.audio_n = ev.audio_n; r.audio_i = ev.audio_i; }
      if (ev.note) { r.l = ev.note; r.r = ''; if (ev.pct != null) r.pct = ev.pct; }
      else if (ev.step === 'merge') { r.pct = 100; r.l = 'объединение видео, звука и субтитров…'; r.r = ''; }
      else {
        if (ev.pct != null) r.pct = ev.pct;
        const parts = [];
        if (ev.total) parts.push(fmtPair(ev.done || 0, ev.total));
        if (ev.speed) parts.push(fmtSize(ev.speed) + '/с');
        r.l = parts.join(' · ') || r.l;
        r.r = ev.eta != null ? 'осталось ' + fmtTime(ev.eta) : '';
      }
    } else {
      const r = S.tc;
      r.state = 'active';
      r.pct = ev.pct;
      const parts = [];
      if (ev.frames) parts.push(`кадр ${groupNum(ev.frame)} из ${groupNum(ev.frames)}`);
      else if (ev.frame) parts.push(`кадр ${groupNum(ev.frame)}`);
      if (ev.speed) parts.push(dec(ev.speed, 1) + '×');
      r.l = parts.join(' · ');
      r.r = ev.eta != null ? 'осталось ' + fmtTime(ev.eta) : '';
    }
    renderRows(); updateTitle();
  },
  stage_done(ev) {
    S.rowsShown = true;
    if (ev.stage === 'download') {
      S.dl = { label: 'Скачивание', state: 'done', step: 'merge', audio_n: S.dl.audio_n, l: fmtSize(ev.size) + (ev.merged ? ' · видео и звук объединены' : ''), r: fmtTime(ev.elapsed) };
      if (S.settingsAtRun.codec !== 'copy') S.tc = { label: 'Транскодирование', state: 'active', pct: 0, l: 'запуск ffmpeg…', r: '' };
    } else {
      const copy = S.tc.copy;
      S.tc = { label: copy ? 'Перепаковка' : 'Транскодирование', state: 'done', copy,
               l: fmtSize(ev.size) + ' · ' + (copy ? 'H.264 от YouTube, без перекодирования' : codecDesc()), r: fmtTime(ev.elapsed) };
    }
    renderRows(); updateTitle();
  },
  tc_mode(ev) {
    if (ev.copy) { S.tc = { ...S.tc, label: 'Перепаковка', copy: true, l: 'видео уже H.264 — перекодирование не нужно' }; renderRows(); }
  },
  item_done(ev) {
    S.lineState[ev.index] = 'done';
    S.lastFile = ev.path; S.lastSize = ev.size; S.lastSrt = ev.srt || [];
    renderGutter(); renderUrlList(); updateButtons();
  },
  item_error(ev) {
    S.lineState[ev.index] = 'error';
    renderGutter(); renderUrlList();
    const failing = S.tc.state === 'active' ? S.tc : S.dl;
    failing.state = 'error'; failing.l = ev.message; failing.r = '';
    renderRows();
    $('errT').textContent = `${S.tc === failing ? 'Транскодирование' : 'Скачивание'} прервано · видео ${ev.index + 1} из ${ev.total}`;
    $('errM').textContent = ev.message;
    $('errBox').classList.remove('hidden');
    setLogOpen(true);
  },
  item_cancelled(ev) {
    S.lineState[ev.index] = 'pending';
    renderGutter(); renderUrlList();
    const r = S.tc.state === 'active' ? S.tc : S.dl;
    r.state = 'error'; r.l = 'отменено, временные файлы удалены'; r.r = '';
    renderRows();
  },
  finished(ev) {
    S.running = false; S.cancelling = false;
    lockSettings(false);
    if (ev.cancelled) {
      $('qLabel').textContent = 'Отменено';
      $('qNext').textContent = ev.saved ? `сохранено ${ev.saved} ${plural(ev.saved, ['файл', 'файла', 'файлов'])}` : '';
    } else {
      $('qLabel').textContent = `Видео ${ev.total} из ${ev.total} · ${ev.failed ? 'с ошибками' : 'готово'}`;
      const parts = [`сохранено ${ev.saved} ${plural(ev.saved, ['файл', 'файла', 'файлов'])}`];
      if (ev.bytes) parts.push(fmtSize(ev.bytes));
      parts.push(fmtTime(ev.elapsed));
      if (ev.failed) parts.push(`ошибок: ${ev.failed}`);
      $('qNext').textContent = parts.join(' · ');
    }
    if (S.lastFile) {
      $('result').classList.remove('hidden');
      fitMiddle($('resPath'), S.lastFile);
      $('resSize').textContent = fmtSize(S.lastSize);
      const srt = S.lastSrt || [];
      $('resSrt').classList.toggle('hidden', !srt.length);
      if (srt.length) {
        const name = srt[0].split(/[\\/]/).pop();
        $('resSrtName').textContent = name + (srt.length > 1 ? `  +${srt.length - 1}` : '');
        $('resSrtName').title = srt.join('\n');
      }
    }
    appendLog(ev.cancelled ? 'отменено' : `готово · ${ev.saved} из ${ev.total}` + (ev.failed ? ` · ошибок: ${ev.failed}` : ' без ошибок'), ev.failed ? 'e' : 'n');
    setTitle('');
    updateButtons();
    S.preview.shownUrl = null;
    showPreviewFor(S.runUrls[S.runUrls.length - 1]);
  },
};

// ---------------------------------------------------------------- log
function appendLog(line, level) {
  const box = $('logBox');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  const d = document.createElement('div');
  if (level === 'e') d.className = 'e'; else if (level === 'c') d.className = 'c';
  d.textContent = line;
  box.appendChild(d);
  if (++S.logLines > 2000) { box.firstChild.remove(); S.logLines--; }
  if (atBottom) box.scrollTop = box.scrollHeight;
  S.logLast = line;
  if (!line.startsWith('$ ')) $('logSum').textContent = line;
}
function setLogOpen(open) {
  $('logHead').setAttribute('aria-expanded', open);
  $('logSec').classList.toggle('open', open);
  $('logBox').classList.toggle('hidden', !open);
  $('bCopyLog').classList.toggle('hidden', !open);
  $('logSum').classList.toggle('hidden', open);
  if (open) $('logBox').scrollTop = $('logBox').scrollHeight;
}

// страница никогда не скроллится: если содержимое не влезает — первым сворачивается журнал
function fitHeight() {
  const c = $('content');
  if (c.scrollHeight > c.clientHeight + 1 && $('logSec').classList.contains('open')) setLogOpen(false);
}
new ResizeObserver(() => requestAnimationFrame(fitHeight)).observe($('content'));
new MutationObserver(() => requestAnimationFrame(fitHeight)).observe($('content'), { subtree: true, attributes: true, attributeFilter: ['class'] });

// ---------------------------------------------------------------- buttons / hint
function updateButtons() {
  const main = $('bMain');
  if (S.running) {
    main.textContent = 'Отмена';
    main.classList.add('cancel');
    main.disabled = S.cancelling;
  } else {
    main.textContent = 'Скачать';
    main.classList.remove('cancel');
    main.disabled = !(S.listMode ? S.runUrls.length : validUrls().length) || S.missing.length > 0;
  }
  $('bFolder').disabled = !S.lastFile;
  $('bClear').disabled = S.running || (!S.listMode && !ta.value.trim());
  $('bPaste').disabled = S.running;
  const hint = $('hint');
  hint.classList.toggle('err', S.missing.length > 0);
  if (S.missing.length) hint.textContent = 'Не найдено в PATH: ' + S.missing.join(', ');
  else if (S.running) hint.textContent = '';
  else if (!ta.value.trim() && !S.listMode) hint.textContent = 'Ctrl+Enter — скачать · Ctrl+V — вставить ссылку';
  else hint.textContent = 'Ctrl+Enter — скачать';
}

// ---------------------------------------------------------------- wiring
function wire() {
  document.querySelectorAll('[data-select]').forEach(h => makeSelect(h, h.dataset.select));

  ta.addEventListener('input', onListChanged);
  ta.addEventListener('scroll', syncGutter);
  ta.addEventListener('focus', () => $('inputBox').classList.add('focus'));
  ta.addEventListener('blur', () => $('inputBox').classList.remove('focus'));
  $('urlList').addEventListener('scroll', syncGutter);
  $('urlList').addEventListener('click', editList);

  $('bPaste').addEventListener('click', async () => appendText(await api.get_clipboard()));
  $('bClear').addEventListener('click', () => {
    if (S.listMode) setListMode(false);
    ta.value = ''; onListChanged(); ta.focus();
  });

  $('setHead').addEventListener('click', () => setSettingsOpen(!S.settings.settings_open));
  $('logHead').addEventListener('click', () => setLogOpen($('logHead').getAttribute('aria-expanded') !== 'true'));
  for (const [head, fn] of [['setHead', setSettingsOpen], ['logHead', setLogOpen]]) {
    $(head).addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); fn(false); }
      if (e.key === 'ArrowRight') { e.preventDefault(); fn(true); }
    });
  }
  $('bCopyLog').addEventListener('click', () => {
    const text = [...$('logBox').children].map(d => d.textContent).join('\r\n');
    api.set_clipboard(text);
    const b = $('bCopyLog'); b.textContent = 'Скопировано';
    setTimeout(() => b.textContent = 'Копировать', 1200);
  });

  const crf = $('crf');
  crf.addEventListener('input', () => { S.settings.crf = +crf.value; onSettingsChanged(); });
  crf.addEventListener('keydown', (e) => {
    if (e.key === 'PageUp' || e.key === 'PageDown') {
      e.preventDefault();
      S.settings.crf = Math.max(10, Math.min(30, S.settings.crf + (e.key === 'PageUp' ? 5 : -5)));
      onSettingsChanged();
    }
  });
  $('bBrowse').addEventListener('click', async () => {
    const d = await api.browse(S.settings.out_dir);
    if (d) { S.settings.out_dir = d; onSettingsChanged(); }
  });
  $('outDir').addEventListener('dblclick', () => $('bBrowse').click());

  $('bMain').addEventListener('click', () => S.running ? cancel() : start());
  $('bFolder').addEventListener('click', () => api.show_in_folder(S.lastFile));
  $('bApp').addEventListener('click', () => (openMenu && openMenu.anchor === $('bApp')) ? closeMenu() : showAppMenu($('bApp')));

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); start(); return; }
    const a = document.activeElement;
    const editable = a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' && a.type !== 'range');
    if (e.ctrlKey && (e.key === 'v' || e.key === 'м') && !editable && !S.running) {
      e.preventDefault();
      api.get_clipboard().then(appendText);
    }
    if (e.ctrlKey && (e.key === 'c' || e.key === 'с') && !editable && $('result').matches(':hover') && S.lastFile) {
      api.set_clipboard(S.lastFile);
    }
    if (e.key === 'F5' || (e.ctrlKey && (e.key === 'r' || e.key === 'p' || e.key === 'f'))) e.preventDefault();
  });
  document.addEventListener('contextmenu', (e) => {
    if (!(e.target === ta || $('logBox').contains(e.target))) e.preventDefault();
  });

  let rt = 0;
  window.addEventListener('resize', () => {
    closeMenu();
    clearTimeout(rt);
    rt = setTimeout(() => {
      fitMiddle($('outDir'), S.settings.out_dir);
      if (S.lastFile && !$('result').classList.contains('hidden')) fitMiddle($('resPath'), S.lastFile);
    }, 60);
  });

  darkMQ.addEventListener('change', applyTheme);
}

async function boot() {
  api = window.pywebview.api;
  const init = await api.init();
  api.app_info().then(x => S.appInfo = x).catch(() => {});
  S.settings = init.settings;
  S.missing = init.missing || [];
  wire();
  api.versions().then(v => {
    // поиск видеокарты стартует вместе с проверкой версий — спрашиваем после
    api.gpu_info().then(g => {
      S.gpu = g;
      if (g) OPTS.encoder[0].h = g.vendor;
      renderSettings();
    }).catch(() => {});
    S.versions = v;
    const box = $('logBox');
    const d = document.createElement('div'); d.textContent = v;
    box.insertBefore(d, box.firstChild); S.logLines++;
    if (!S.logLast) $('logSum').textContent = v;
  });
  renderSettings();
  setLogOpen(false);
  renderGutter();
  renderPreviewState('empty');
  updateButtons();
  ta.focus();
}
window.addEventListener('pywebviewready', boot);
</script>
